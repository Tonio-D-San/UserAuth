networks:
  application:
    driver: bridge
  databases:
    driver: bridge

volumes:
  postgres_test:
    driver: local

services:
  ############## Keycloak Dev ##############
  auth-hub:
    container_name: ${PROJECT_DEV}
    depends_on:
      - ${POSTGRES_DEV}
      - ${KEYCLOAK_DEV}
    build:
      context: ./
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8082:8082"
    restart: no
    networks:
      - application
      - databases

  ############## Postgres Test ##############
  auth-hub-postgres-dev:
    image: postgres:15.6
    container_name: ${POSTGRES_DEV}
    restart: no
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - '${POSTGRES_EXTERNAL_PORT}:${POSTGRES_INTERNAL_PORT}'
    env_file:
      - .env
    volumes:
      - postgres_test:/var/lib/postgresql/data
      - ./database/postgres/user_db_structure.sql:/docker-entrypoint-initdb.d/01_user_db_structure.sql
      - ./database/postgres/user_db_insert_user_test.sql:${DB_POSTGRES_CONTAINER_LOCATION}/02_user_insert.sql
    networks:
      - databases