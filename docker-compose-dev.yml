networks:
  application:
    driver: bridge
  databases:
    driver: bridge

volumes:
  postgres_test:
    driver: local

services:
  ############## Keycloak Dev ##############
  auth-hub:
    container_name: ${PROJECT_DEV}
    depends_on:
      - ${POSTGRES_DEV}
      - ${KEYCLOAK_DEV}
    build:
      context: ./
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8082:8082"
    restart: no
    networks:
      - application
      - databases

  ############## Postgres Core ##############
  postgres-core:
    image: postgres:15.6
    container_name: ${PG_CONTAINER}
    restart: no
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ${DB_POSTGRES_LOCAL_LOCATION}/${PERSON_DDL_NAME}.sql:${DB_POSTGRES_CONTAINER_LOCATION}/01_auth_ddl.sql
      - ${DB_POSTGRES_LOCAL_LOCATION}/${GROUP_DUMP_NAME}.sql:${DB_POSTGRES_CONTAINER_LOCATION}/02_group_dump.sql
      - ${DB_POSTGRES_LOCAL_LOCATION}/${DASHBOARD_DDL_NAME}.sql:${DB_POSTGRES_CONTAINER_LOCATION}/03_dashboard_ddl.sql
    networks:
      - databases