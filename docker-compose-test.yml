  #docker start dpms-kc-TEST

  keycloak_test:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: ${KC_CONTAINER}
    restart: no
    environment:
      KC_PROXY: edge
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./services/keycloak/themes/:/opt/keycloak/themes/
      - ./services/keycloak/${PERSON_DUMP_NAME}.json:/opt/keycloak/data/import/${PERSON_DUMP_NAME}.json
    command:
      [ "start-dev", "--import-realm", "--http-port=5443", "--http-relative-path=/kc", "--proxy-headers=xforwarded" ]
    ports:
      - '5443:5443'
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/5443 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"
        ]
      interval: 5s
      timeout: 2s
      retries: 50
    networks:
      - application

  gateway:
    image: caddy:2
    container_name: gateway
    restart: no
    ports:
      - "9001:9000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - application
