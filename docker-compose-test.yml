networks:
  application:
    driver: bridge
  databases:
    driver: bridge

volumes:
  postgres_test:
    driver: local

services:

  postgres-core:
    image: postgres:15.6
    container_name: ${PG_CONTAINER}
    restart: no
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_test:/var/lib/postgresql/data
      - ${DB_POSTGRES_LOCAL_LOCATION}/${PERSON_DDL_NAME}.sql:${DB_POSTGRES_CONTAINER_LOCATION}/01_auth_ddl.sql
      - ${DB_POSTGRES_LOCAL_LOCATION}/${GROUP_DUMP_NAME}.sql:${DB_POSTGRES_CONTAINER_LOCATION}/02_group_dump.sql
      - ${DB_POSTGRES_LOCAL_LOCATION}/${DASHBOARD_DDL_NAME}.sql:${DB_POSTGRES_CONTAINER_LOCATION}/03_dashboard_ddl.sql
      - ${DB_POSTGRES_LOCAL_LOCATION}/${ABILITIES_DUMP_NAME}.sql:${DB_POSTGRES_CONTAINER_LOCATION}/04_abilities_dump.sql
    networks:
      - databases

  postgres-test:
    image: postgres:15.6
    container_name: ${PG_CONTAINER}_dump
    depends_on:
      postgres-core:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_test:/var/lib/postgresql/data
      - ${DB_POSTGRES_LOCAL_LOCATION}/${PERSON_DUMP_NAME}.sql:${DB_POSTGRES_CONTAINER_LOCATION}/01_test_dump.sql
    command: >
      bash -c "PGPASSWORD=${POSTGRES_PASSWORD} psql -h ${PG_CONTAINER} -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f ${DB_POSTGRES_CONTAINER_LOCATION}/01_test_dump.sql"
    networks:
      - databases

  ############## Keycloak Test ##############
  keycloak_test:
    image: quay.io/keycloak/keycloak:23.0.1
    container_name: ${KC_CONTAINER}
    restart: no
    environment:
      KC_HOSTNAME: ${HOST}
      KC_HOSTNAME_PORT: 5443
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./services/keycloak/${PERSON_DUMP_NAME}.json:/opt/keycloak/data/import/${PERSON_DUMP_NAME}.json
    command: [ "start-dev", "--import-realm","--http-port=5443" ]
    ports:
      - '5443:5443'
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/5443 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"
        ]
      interval: 5s
      timeout: 2s
      retries: 50
    networks:
      - application
