networks:
  application:
    driver: bridge
  databases:
    driver: bridge

volumes:
  postgres_test:
    driver: local

services:

  postgres-core:
    image: postgres:15.6
    container_name: ${PG_CONTAINER}
    restart: no
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_test:/var/lib/postgresql/data
      # --- Utenti (Auth) ---
      - ${DDL_AUTH_HUB_LOCATION}/${PERSON_DDL_NAME}.sql:${DB_POSTGRES_CONTAINER_LOCATION}/01_auth_ddl.sql
      - ${DUMP_AUTH_HUB_LOCATION}/${GROUP_DUMP_NAME}.sql:${DB_POSTGRES_CONTAINER_LOCATION}/02_group_dump.sql
      - ${DUMP_AUTH_HUB_LOCATION}/${PERSON_DUMP_NAME}.sql:${DB_POSTGRES_CONTAINER_LOCATION}/03_person_dump.sql
      # --- Piattaforma (Ala) ---
      - ${DDL_CAMPAIGN_LOCATION}/schema_DDL.sql:${DB_POSTGRES_CONTAINER_LOCATION}/10_schema.sql
      - ${DDL_CAMPAIGN_LOCATION}/seed.sql:${DB_POSTGRES_CONTAINER_LOCATION}/11_seed.sql
      - ${DDL_CAMPAIGN_LOCATION}/triggers.sql:${DB_POSTGRES_CONTAINER_LOCATION}/12_triggers.sql
      # --- Piattaforma (Diary) ---
      - ${DDL_DIARY_LOCATION}/diaries_DDL.sql:${DB_POSTGRES_CONTAINER_LOCATION}/13_diaries.sql
      # --- Piattaforma (Payments) ---
      - ${DDL_PAYMENTS_LOCATION}/payments_DDL.sql:${DB_POSTGRES_CONTAINER_LOCATION}/14_payments.sql
    networks:
      - databases

