networks:
  application:
    driver: bridge
  databases:
    driver: bridge

volumes:
  postgres:
    driver: local

services:

  postgres-core:
    image: postgres:15.6
    container_name: ${PG_CONTAINER_TEST}
    restart: no
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ${DB_POSTGRES_LOCAL_LOCATION}/${PERSON_DDL_NAME}.sql:${DB_POSTGRES_CONTAINER_LOCATION}/01_ddl.sql
      - ${DB_POSTGRES_LOCAL_LOCATION}/${GROUP_DUMP_NAME}.sql:${DB_POSTGRES_CONTAINER_LOCATION}/02_group_dump.sql
    networks:
      - databases

  postgres-test:
    image: postgres:15.6
    container_name: ${PG_CONTAINER_TEST}_dump
    depends_on:
      postgres-core:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ${DB_POSTGRES_LOCAL_LOCATION}/${PERSON_DUMP_NAME}.sql:${DB_POSTGRES_CONTAINER_LOCATION}/03_test_dump.sql
    command: >
      bash -c "PGPASSWORD=${POSTGRES_PASSWORD} psql -h ${PG_CONTAINER_TEST} -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f ${DB_POSTGRES_CONTAINER_LOCATION}/03_test_dump.sql"
    networks:
      - databases
